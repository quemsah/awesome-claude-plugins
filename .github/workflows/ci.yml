name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    outputs:
      app: ${{ steps.filter.outputs.app }}
      crawler: ${{ steps.filter.outputs.crawler }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect affected areas
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - 'ui/**'
              - 'packages/catalog-contract/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            crawler:
              - 'crawler/**'
              - 'README.md'
              - 'ui/src/data/repos.json'
              - 'packages/catalog-contract/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install app workspace dependencies
        run: npm ci --workspace=awesome-claude-plugins --include-workspace-root=false

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Run linter
        run: npm run lint
        working-directory: ui

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ui

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('ui/src/**', 'ui/next.config.ts', 'ui/postcss.config.mjs', 'ui/tailwind.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js app
        run: npm run build
        working-directory: ui
        env:
          GITHUB_API_URL: http://127.0.0.1:3100
          GITHUB_RAW_URL: http://127.0.0.1:3100

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ui
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Ensure Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: ui
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run browser e2e tests
        run: npm run test:e2e
        working-directory: ui
        env:
          PLAYWRIGHT_PREBUILT: '1'

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  crawler:
    name: crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crawler/.nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install crawler workspace dependencies
        run: npm ci --workspace=catalog-crawler --include-workspace-root=false

      - name: Run crawler typecheck
        run: npm run typecheck
        working-directory: crawler

      - name: Run crawler linter
        run: npm run lint
        working-directory: crawler

      - name: Run crawler unit tests
        run: npm run test
        working-directory: crawler

      - name: Typecheck crawler shared contract integration
        run: npm run typecheck:integration
        working-directory: crawler

      - name: Test crawler output with the shared catalog contract
        run: npm run test:integration
        working-directory: crawler
