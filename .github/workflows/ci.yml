name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    outputs:
      app: ${{ steps.filter.outputs.app }}
      crawler: ${{ steps.filter.outputs.crawler }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect affected areas
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'awesomeclaudeplugins.com/ui/**'
              - 'awesomeclaudeplugins.com/shared/**'
              - 'awesomeclaudeplugins.com/package.json'
              - 'awesomeclaudeplugins.com/package-lock.json'
              - 'awesomeclaudeplugins.com/.npmrc'
              - 'awesomeclaudeplugins.com/.nvmrc'
              - 'awesomeclaudeplugins.com/.node-version'
              - '.github/workflows/ci.yml'
            crawler:
              - 'awesomeclaudeplugins.com/crawler/**'
              - 'README.md'
              - 'awesomeclaudeplugins.com/ui/src/data/repos.json'
              # Crawler's integration test still imports the UI stats schema.
              - 'awesomeclaudeplugins.com/ui/src/schemas/**'
              - 'awesomeclaudeplugins.com/ui/package.json'
              - 'awesomeclaudeplugins.com/shared/**'
              - 'awesomeclaudeplugins.com/package.json'
              - 'awesomeclaudeplugins.com/package-lock.json'
              - 'awesomeclaudeplugins.com/.npmrc'
              - 'awesomeclaudeplugins.com/.nvmrc'
              - 'awesomeclaudeplugins.com/.node-version'
              - '.github/workflows/ci.yml'

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: awesomeclaudeplugins.com/ui/.nvmrc
          cache: 'npm'
          cache-dependency-path: awesomeclaudeplugins.com/package-lock.json

      - name: Install app workspace dependencies
        run: npm ci --workspace=awesome-claude-plugins --include-workspace-root=false
        working-directory: awesomeclaudeplugins.com

      - name: Run typecheck
        run: npm run typecheck
        working-directory: awesomeclaudeplugins.com/ui

      - name: Run linter
        run: npm run lint
        working-directory: awesomeclaudeplugins.com/ui

      - name: Run unit tests
        run: npm run test:unit
        working-directory: awesomeclaudeplugins.com/ui

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: awesomeclaudeplugins.com/ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('awesomeclaudeplugins.com/package-lock.json') }}-${{ hashFiles('awesomeclaudeplugins.com/ui/src/**', 'awesomeclaudeplugins.com/ui/next.config.ts', 'awesomeclaudeplugins.com/ui/postcss.config.mjs', 'awesomeclaudeplugins.com/ui/tailwind.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('awesomeclaudeplugins.com/package-lock.json') }}-

      - name: Build Next.js app
        run: npm run build
        working-directory: awesomeclaudeplugins.com/ui
        env:
          GITHUB_API_URL: http://127.0.0.1:3100
          GITHUB_RAW_URL: http://127.0.0.1:3100

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('awesomeclaudeplugins.com/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: awesomeclaudeplugins.com/ui
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Ensure Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: awesomeclaudeplugins.com/ui
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run browser e2e tests
        run: npm run test:e2e
        working-directory: awesomeclaudeplugins.com/ui
        env:
          PLAYWRIGHT_PREBUILT: '1'

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            awesomeclaudeplugins.com/ui/playwright-report/
            awesomeclaudeplugins.com/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  crawler:
    name: crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: awesomeclaudeplugins.com/crawler/.nvmrc
          cache: 'npm'
          cache-dependency-path: awesomeclaudeplugins.com/package-lock.json

      - name: Install crawler workspace dependencies
        run: npm ci --workspace=catalog-crawler --include-workspace-root=false
        working-directory: awesomeclaudeplugins.com

      - name: Smoke test native SQLite bindings
        run: npm run smoke:sqlite
        working-directory: awesomeclaudeplugins.com/crawler

      - name: Run crawler typecheck
        run: npm run typecheck
        working-directory: awesomeclaudeplugins.com/crawler

      - name: Run crawler linter
        run: npm run lint
        working-directory: awesomeclaudeplugins.com/crawler

      - name: Run crawler unit tests
        run: npm run test
        working-directory: awesomeclaudeplugins.com/crawler

      - name: Typecheck crawler shared contract integration
        run: npm run typecheck:integration
        working-directory: awesomeclaudeplugins.com/crawler

      - name: Test crawler output with the shared catalog contract
        run: npm run test:integration
        working-directory: awesomeclaudeplugins.com/crawler
