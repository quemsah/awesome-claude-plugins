name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      app: ${{ steps.filter.outputs.app }}
      crawler: ${{ steps.filter.outputs.crawler }}

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect affected areas
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - 'ui/**'
              - '.github/workflows/ci.yml'
            crawler:
              - 'crawler/**'
              - 'README.md'
              - 'ui/src/data/repos.json'
              - 'ui/src/schemas/**'
              - 'ui/src/lib/repositoryIdentity.ts'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/.npmrc'
              - '.github/workflows/ci.yml'

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Run linter
        run: npm run lint
        working-directory: ui

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: Run browser e2e tests
        run: npm run test:e2e
        working-directory: ui

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  crawler:
    name: crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        run: npm ci
        working-directory: crawler

      - name: Run crawler typecheck
        run: npm run typecheck
        working-directory: crawler

      - name: Run crawler linter
        run: npm run lint
        working-directory: crawler

      - name: Run crawler unit tests
        run: npm run test
        working-directory: crawler

      - name: Install UI schema dependencies
        run: npm ci
        working-directory: ui

      - name: Typecheck crawler UI integration
        run: npm run typecheck:integration
        working-directory: crawler

      - name: Test crawler output with UI schemas
        run: npm run test:integration
        working-directory: crawler
