name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: app
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Run linter
        run: npm run lint
        working-directory: ui

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: Run browser e2e tests
        run: npm run test:e2e
        working-directory: ui

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  crawler:
    name: crawler
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        run: npm ci
        working-directory: crawler

      - name: Run crawler typecheck
        run: npm run typecheck
        working-directory: crawler

      - name: Run crawler linter
        run: npm run lint
        working-directory: crawler

      - name: Run crawler unit tests
        run: npm run test
        working-directory: crawler

      - name: Install UI schema dependencies
        run: npm ci
        working-directory: ui

      - name: Typecheck crawler UI integration
        run: npm run typecheck:integration
        working-directory: crawler

      - name: Test crawler output with UI schemas
        run: npm run test:integration
        working-directory: crawler
