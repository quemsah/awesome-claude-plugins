name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      app: ${{ steps.filter.outputs.app }}
      crawler: ${{ steps.filter.outputs.crawler }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Detect affected areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'ui/**'
              - 'packages/catalog-contract/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            crawler:
              - 'crawler/**'
              - 'README.md'
              - 'ui/src/data/repos.json'
              - 'packages/catalog-contract/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install app workspace dependencies
        run: npm ci --workspace=awesome-claude-plugins --include-workspace-root=false

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Run linter
        run: npm run lint
        working-directory: ui

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: Run browser e2e tests
        run: npm run test:e2e
        working-directory: ui

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  crawler:
    name: crawler
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install crawler workspace dependencies
        run: npm ci --workspace=catalog-crawler --include-workspace-root=false

      - name: Run crawler typecheck
        run: npm run typecheck
        working-directory: crawler

      - name: Run crawler linter
        run: npm run lint
        working-directory: crawler

      - name: Run crawler unit tests
        run: npm run test
        working-directory: crawler

      - name: Typecheck crawler shared contract integration
        run: npm run typecheck:integration
        working-directory: crawler

      - name: Test crawler output with the shared catalog contract
        run: npm run test:integration
        working-directory: crawler
