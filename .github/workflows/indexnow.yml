name: IndexNow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Submit changed repository URLs, or the full live sitemap'
        required: true
        default: full
        type: choice
        options:
          - full
          - changed
  push:
    branches: [main]
    paths:
      - .github/workflows/indexnow.yml
      - awesomeclaudeplugins.com/ui/scripts/indexnow*.mjs
      - awesomeclaudeplugins.com/ui/src/data/repos.json
  pull_request:
    paths:
      - .github/workflows/indexnow.yml
      - awesomeclaudeplugins.com/ui/scripts/indexnow*.mjs
      - awesomeclaudeplugins.com/ui/src/data/repos.json
  schedule:
    # Run after deployment, never as a blocking check on the commit being deployed.
    - cron: '17,47 * * * *'

jobs:
  validate:
    name: Validate IndexNow change detection
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test IndexNow change detection
        run: node --test scripts/indexnow-*.test.mjs
        working-directory: awesomeclaudeplugins.com/ui

  notify:
    name: Submit changed repository URLs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: indexnow-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test IndexNow change detection
        run: node --test scripts/indexnow-*.test.mjs
        working-directory: awesomeclaudeplugins.com/ui

      - name: Restore and save IndexNow baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/indexnow-state
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-${{ github.ref_name }}-

      - name: Submit IndexNow URLs
        run: npm run indexnow
        working-directory: awesomeclaudeplugins.com/ui
        env:
          INDEXNOW_SITE_URL: ${{ vars.INDEXNOW_SITE_URL || 'https://awesomeclaudeplugins.com' }}
          INDEXNOW_MODE: ${{ inputs.mode || 'changed' }}
          INDEXNOW_BASELINE_PATH: ${{ runner.temp }}/indexnow-state/repos.json
          # A scheduled run skips and retries later if Railway has not deployed the catalog.
          INDEXNOW_DEFER_UNTIL_DEPLOYED: ${{ github.event_name == 'schedule' }}
