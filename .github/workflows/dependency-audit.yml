name: Dependency security audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'awesomeclaudeplugins.com/package.json'
      - 'awesomeclaudeplugins.com/bun.lock'
      - 'awesomeclaudeplugins.com/ui/package.json'
      - 'awesomeclaudeplugins.com/crawler/package.json'
      - 'awesomeclaudeplugins.com/shared/**/package.json'
      - '.github/workflows/dependency-audit.yml'
  # Weekly on Mondays at 07:00 UTC, including weeks without dependency PRs.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('awesomeclaudeplugins.com/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: awesomeclaudeplugins.com
        run: bun install --frozen-lockfile

      - name: Audit dependency graph
        working-directory: awesomeclaudeplugins.com
        shell: bash
        run: |
          bun audit --json > "$RUNNER_TEMP/audit.json" || true
          bun - "$RUNNER_TEMP/audit.json" <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const packages = Object.keys(data)
          console.log(`AUDIT: ${packages.length} vulnerable package(s) reported`)
          for (const [name, advisories] of Object.entries(data)) {
            for (const item of advisories) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                title: item.title,
                vulnerable_versions: item.vulnerable_versions,
                url: item.url,
              }))
            }
          }
          NODE

      - name: Enforce no high or critical advisories
        working-directory: awesomeclaudeplugins.com
        run: bun audit --audit-level=high
