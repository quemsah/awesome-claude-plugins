name: Dependency security audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'awesomeclaudeplugins.com/package.json'
      - 'awesomeclaudeplugins.com/bun.lock'
      - 'awesomeclaudeplugins.com/.bun-version'
      - 'awesomeclaudeplugins.com/ui/package.json'
      - 'awesomeclaudeplugins.com/crawler/package.json'
      - 'awesomeclaudeplugins.com/shared/**/package.json'
      - '.github/workflows/dependency-audit.yml'
  # Weekly on Mondays at 07:00 UTC, including weeks without dependency PRs.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version-file: awesomeclaudeplugins.com/.bun-version

      - name: Cache Bun global install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('awesomeclaudeplugins.com/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: awesomeclaudeplugins.com

      - name: Audit dependency graph
        working-directory: awesomeclaudeplugins.com
        shell: bash
        run: |
          bun audit --json > "$RUNNER_TEMP/audit-all.json" || true
          node - "$RUNNER_TEMP/audit-all.json" <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          console.log(`AUDIT ALL: ${JSON.stringify(data.metadata?.vulnerabilities ?? {})}`)
          for (const [id, issue] of Object.entries(data.advisories ?? {})) {
            console.log(JSON.stringify({
              id,
              name: issue.name ?? issue.module_name,
              severity: issue.severity,
              range: issue.vulnerable_versions,
              title: issue.title,
              url: issue.url,
            }))
          }
          NODE

      - name: Enforce no high or critical advisories
        working-directory: awesomeclaudeplugins.com
        run: |
          bun audit --audit-level=high
