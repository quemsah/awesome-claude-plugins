name: Dependency security audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'awesomeclaudeplugins.com/package.json'
      - 'awesomeclaudeplugins.com/bun.lock'
      - 'awesomeclaudeplugins.com/.bun-version'
      - 'awesomeclaudeplugins.com/ui/package.json'
      - 'awesomeclaudeplugins.com/crawler/package.json'
      - 'awesomeclaudeplugins.com/shared/**/package.json'
      - '.github/workflows/dependency-audit.yml'
  # Weekly on Mondays at 07:00 UTC, including weeks without dependency PRs.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: awesomeclaudeplugins.com/.bun-version

      - name: Audit production and complete dependency graphs
        working-directory: awesomeclaudeplugins.com
        shell: bash
        run: |
          bun audit --prod || true
          bun audit || true

      - name: Enforce no high or critical advisories in production or development
        working-directory: awesomeclaudeplugins.com
        run: |
          bun audit --prod --audit-level=high
          bun audit --audit-level=high
