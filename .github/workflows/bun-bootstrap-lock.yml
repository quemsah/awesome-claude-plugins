name: Bootstrap Bun lockfile for bun-6-x-h
on:
  push:
    branches: [bun-6-x-h]
    paths:
      - .github/workflows/bun-bootstrap-lock.yml
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Migrate npm lockfile without changing dependency ranges
        run: bun install --lockfile-only
        working-directory: awesomeclaudeplugins.com
      - name: Commit generated Bun lockfile to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test -s awesomeclaudeplugins.com/bun.lock
          git add awesomeclaudeplugins.com/bun.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(bun): generate migrated lockfile" || exit 0
          git push origin HEAD:bun-6-x-h
